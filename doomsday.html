<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arval Doomsday Clock — 10 Weeks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(ellipse at center, #001a0f 0%, #000d06 50%, #000 100%);
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        /* Header */
        .header { display: flex; flex-direction: column; align-items: center; }
        .arval-logo {
            font-size: 2.8rem; font-weight: 700; letter-spacing: 8px;
            color: #008755;
            text-shadow: 0 0 30px rgba(0,135,85,0.3), 0 2px 4px rgba(0,0,0,0.5);
        }
        .arval-sub {
            font-size: 0.75rem; color: #6ABB97;
            letter-spacing: 6px; text-transform: uppercase; margin-top: 0.2rem;
        }
        .bnp-badge {
            display: inline-block; margin-top: 0.6rem;
            padding: 0.2rem 1rem;
            border: 1px solid rgba(0,135,85,0.25); border-radius: 3px;
            font-size: 0.5rem; color: #39A87B; letter-spacing: 4px;
        }

        /* Doomsday Clock - properly centered */
        .clock-wrapper {
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .clock-container {
            position: relative;
            width: 280px; height: 280px;
        }
        .clock-face {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid #008755;
            box-shadow: 0 0 40px rgba(0,135,85,0.15), inset 0 0 40px rgba(0,135,85,0.03);
            background: radial-gradient(circle at 40% 40%, #001f12, #000);
        }
        .clock-marks { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .clock-mark {
            position: absolute;
            top: 10px; left: calc(50% - 1px);
            width: 2px; height: 10px;
            background: #39A87B;
            transform-origin: 1px 130px;
        }
        .clock-mark.major { width: 3px; height: 16px; background: #008755; left: calc(50% - 1.5px); transform-origin: 1.5px 130px; }

        .clock-hand-minute {
            position: absolute; top: 50%; left: 50%;
            width: 3px; height: 95px;
            background: linear-gradient(to top, transparent, #39A87B, #6ABB97);
            transform-origin: 50% 100%;
            transform: rotate(0deg);
            margin-left: -1.5px; margin-top: -95px;
            border-radius: 2px;
            transition: transform 1s ease;
            box-shadow: 0 0 10px rgba(0,135,85,0.6);
        }
        .clock-hand-hour {
            position: absolute; top: 50%; left: 50%;
            width: 4px; height: 65px;
            background: linear-gradient(to top, transparent, #007348, #008755);
            transform-origin: 50% 100%;
            transform: rotate(0deg);
            margin-left: -2px; margin-top: -65px;
            border-radius: 2px;
            transition: transform 1s ease;
        }
        .clock-center {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: radial-gradient(circle, #39A87B, #008755);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px rgba(0,135,85,0.8);
        }
        .clock-midnight {
            position: absolute; top: 12%; left: 50%; transform: translateX(-50%);
            font-size: 0.45rem; color: #ff4400;
            letter-spacing: 3px; text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255,50,0,0.3);
        }
        .clock-time {
            position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%);
            font-size: 1.3rem; font-weight: 700; color: #008755;
            text-shadow: 0 0 8px rgba(0,135,85,0.3);
            letter-spacing: 2px;
        }

        /* Glow rings */
        .glow-ring {
            position: absolute; top: 50%; left: 50%;
            width: 300px; height: 300px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(0,135,85,0.08);
            animation: ringPulse 4s ease-in-out infinite;
            pointer-events: none;
        }
        .glow-ring:nth-child(2) { width: 320px; height: 320px; animation-delay: -2s; }
        @keyframes ringPulse {
            0%,100% { transform: translate(-50%,-50%) scale(1); opacity:0.2; }
            50% { transform: translate(-50%,-50%) scale(1.03); opacity:0.5; }
        }

        /* Countdown */
        .countdown { display:flex; gap:0.8rem; justify-content:center; flex-wrap:wrap; }
        .time-block {
            background: rgba(0,135,85,0.04);
            border: 1px solid rgba(0,135,85,0.25);
            border-radius: 6px; padding: 0.8rem 1rem; min-width: 80px;
        }
        .time-value { font-size: 2.2rem; font-weight: 700; color: #008755; text-shadow: 0 0 12px rgba(0,135,85,0.3); }
        .time-label { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 3px; margin-top: 0.2rem; color: #6ABB97; }

        /* Week progress */
        .weeks-bar { display:flex; gap:4px; justify-content:center; }
        .week-block {
            width:28px; height:28px; border:1px solid rgba(0,135,85,0.25);
            border-radius:3px; display:flex; align-items:center; justify-content:center;
            font-size:0.45rem; color:#6ABB97; transition:all 0.3s;
        }
        .week-block.passed { background:rgba(0,135,85,0.25); border-color:#008755; color:#fff; }
        .week-block.current { background:rgba(0,135,85,0.4); border-color:#39A87B; color:#fff; box-shadow:0 0 12px rgba(0,135,85,0.4); animation:weekPulse 1.5s ease-in-out infinite; }
        @keyframes weekPulse { 0%,100%{box-shadow:0 0 8px rgba(0,135,85,0.3);} 50%{box-shadow:0 0 18px rgba(0,135,85,0.5);} }
        .weeks-label { font-size:0.55rem; color:#6ABB97; letter-spacing:2px; text-transform:uppercase; margin-top:0.4rem; }

        /* Progress bar */
        .progress-bar { width:300px; height:5px; background:rgba(0,135,85,0.08); border-radius:3px; overflow:hidden; border:1px solid rgba(0,135,85,0.15); }
        .progress-fill { height:100%; background:linear-gradient(to right,#007348,#008755,#39A87B); border-radius:3px; transition:width 1s; }

        /* Status */
        .status { font-size:0.7rem; letter-spacing:3px; text-transform:uppercase; color:#39A87B; }

        /* Quote */
        .doom-quote {
            font-size: 0.7rem; font-style: italic; color: rgba(106,187,151,0.6);
            max-width: 450px; line-height: 1.7;
            min-height: 2.5rem; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }

        /* Navigation */
        .nav-btn {
            position:fixed; top:15px; left:15px; z-index:50;
            background:rgba(0,135,85,0.08); border:1px solid rgba(0,135,85,0.3);
            color:#39A87B; font-size:0.65rem; letter-spacing:2px;
            padding:0.5rem 1rem; border-radius:4px;
            cursor:pointer; transition:all 0.3s;
            text-decoration:none; text-transform:uppercase;
        }
        .nav-btn:hover { background:rgba(0,135,85,0.15); border-color:#008755; box-shadow:0 0 10px rgba(0,135,85,0.2); }

        /* Particles */
        .particle-green { position:fixed; border-radius:50%; background:#008755; pointer-events:none; }

        /* Scanline */
        .scanline-green {
            position:fixed; top:0;left:0;right:0;bottom:0; pointer-events:none; z-index:1;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,135,85,0.01) 3px, rgba(0,135,85,0.01) 6px);
        }

        @media (max-width: 768px) {
            .clock-container { width:220px; height:220px; }
            .clock-mark { transform-origin:1px 100px; top:10px; }
            .clock-mark.major { transform-origin:1.5px 100px; }
            .clock-hand-minute { height:72px; margin-top:-72px; }
            .clock-hand-hour { height:50px; margin-top:-50px; }
            .glow-ring { width:240px; height:240px; }
            .glow-ring:nth-child(2) { width:260px; height:260px; }
            .arval-logo { font-size:2rem; }
            .time-value { font-size:1.8rem; }
            .week-block { width:22px; height:22px; font-size:0.35rem; }
            .container { gap:0.8rem; }
        }
    </style>
</head>
<body>
    <div class="scanline-green"></div>
    <a href="countdown.html" class="nav-btn">☢ Team Oppenheimer</a>

    <div class="container">
        <div class="header">
            <div class="arval-logo">ARVAL</div>
            <div class="arval-sub">Doomsday Clock</div>
            <div class="bnp-badge">BNP PARIBAS GROUP</div>
        </div>

        <div class="clock-wrapper">
            <div class="glow-ring"></div>
            <div class="glow-ring"></div>
            <div class="clock-container">
                <div class="clock-face">
                    <div class="clock-marks" id="clockMarks"></div>
                    <div class="clock-midnight">MIDNIGHT</div>
                    <div class="clock-hand-hour" id="hourHand"></div>
                    <div class="clock-hand-minute" id="minuteHand"></div>
                    <div class="clock-center"></div>
                    <div class="clock-time" id="clockTimeLabel">11:50</div>
                </div>
            </div>
        </div>

        <div class="countdown">
            <div class="time-block"><div class="time-value" id="weeks">--</div><div class="time-label">Weeks</div></div>
            <div class="time-block"><div class="time-value" id="days">--</div><div class="time-label">Days</div></div>
            <div class="time-block"><div class="time-value" id="hours">--</div><div class="time-label">Hours</div></div>
            <div class="time-block"><div class="time-value" id="minutes">--</div><div class="time-label">Minutes</div></div>
        </div>

        <div class="weeks-bar" id="weeksBar"></div>
        <div class="weeks-label" id="weeksLabel">Week 1 of 10</div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <p class="status" id="status">Doomsday clock — ticking</p>

        <div class="doom-quote" id="doomQuote">"It is now 90 seconds to midnight."</div>
    </div>

    <script>
        const targetDate = new Date('2026-10-01T00:00:00').getTime();
        const startDate = new Date('2026-07-23T00:00:00').getTime();
        const totalDuration = targetDate - startDate;
        const totalWeeks = 10;

        const doomQuotes = [
            '"It is now 90 seconds to midnight." — Bulletin of the Atomic Scientists',
            '"We are not combating the weather, we are the weather." — Doomsday Clock Statement',
            '"The clock ticks. Every second is a step closer to the irreversible."',
            '"Midnight represents catastrophe. How close are we willing to get?"',
            '"The Doomsday Clock is a reminder that the world can still choose a different path."',
            '"Time does not wait for decisions to be made."',
            '"Every week that passes is a week that cannot be recovered."',
            '"The countdown is not a prediction — it is a warning."',
            '"When the clock strikes twelve, there are no second chances."',
            '"We have moved the hands forward. The question is: can we move them back?"',
            '"The end is not an event. It is a deadline." — Arval Operations',
            '"In 10 weeks, the world as we know it changes."',
            '"Tick. Tick. Tick. Each second costs more than the last."',
            '"There is no snooze button on the doomsday clock."',
            '"The closer to midnight, the harder it is to turn back."',
        ];
        let quoteIndex = 0;

        function getProgress() {
            return Math.min(Math.max((Date.now() - startDate) / totalDuration, 0), 1);
        }

        function getCurrentWeek() {
            const elapsed = Date.now() - startDate;
            return Math.min(Math.floor(elapsed / (7*86400000)) + 1, totalWeeks);
        }

        function setupClock() {
            const marks = document.getElementById('clockMarks');
            for (let i = 0; i < 60; i++) {
                const mark = document.createElement('div');
                mark.className = 'clock-mark' + (i % 5 === 0 ? ' major' : '');
                mark.style.transform = `rotate(${i * 6}deg)`;
                marks.appendChild(mark);
            }
        }

        function setupWeeks() {
            const bar = document.getElementById('weeksBar');
            for (let i = 1; i <= totalWeeks; i++) {
                const block = document.createElement('div');
                block.className = 'week-block';
                block.textContent = i;
                block.id = 'week-' + i;
                bar.appendChild(block);
            }
        }

        function updateCountdown() {
            const diff = targetDate - Date.now();
            const progress = getProgress();
            const currentWeek = getCurrentWeek();

            if (diff <= 0) {
                document.getElementById('weeks').textContent = '0';
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('status').textContent = '☢ MIDNIGHT — DOOMSDAY ☢';
                document.getElementById('status').style.color = '#ff3300';
                document.getElementById('clockTimeLabel').textContent = '12:00';
                document.title = '☢ MIDNIGHT — Arval Doomsday';
                return;
            }

            document.getElementById('weeks').textContent = Math.floor(diff / (7*86400000));
            document.getElementById('days').textContent = Math.floor((diff % (7*86400000)) / 86400000);
            document.getElementById('hours').textContent = Math.floor((diff % 86400000) / 3600000);
            document.getElementById('minutes').textContent = Math.floor((diff % 3600000) / 60000);

            document.getElementById('progress').style.width = (progress * 100) + '%';

            for (let i = 1; i <= totalWeeks; i++) {
                const block = document.getElementById('week-' + i);
                block.classList.remove('passed', 'current');
                if (i < currentWeek) block.classList.add('passed');
                else if (i === currentWeek) block.classList.add('current');
            }
            document.getElementById('weeksLabel').textContent = `Week ${currentWeek} of ${totalWeeks}`;

            // Clock hands: 180° (6 o'clock) to 360° (12 o'clock / midnight)
            const minAngle = 180 + progress * 180;
            const hourAngle = 180 + progress * 170;
            document.getElementById('minuteHand').style.transform = `rotate(${minAngle}deg)`;
            document.getElementById('hourHand').style.transform = `rotate(${hourAngle}deg)`;

            // Time display
            const minsLeft = Math.round((1 - progress) * 60);
            document.getElementById('clockTimeLabel').textContent = minsLeft <= 0 ? '12:00' : `11:${String(60 - minsLeft).padStart(2, '0')}`;

            // Status
            if (progress < 0.3) { document.getElementById('status').textContent = 'Doomsday clock — ticking'; document.getElementById('status').style.color = '#39A87B'; }
            else if (progress < 0.6) { document.getElementById('status').textContent = 'Minutes to midnight decreasing'; document.getElementById('status').style.color = '#6ABB97'; }
            else if (progress < 0.8) { document.getElementById('status').textContent = '⚠ Approaching midnight'; document.getElementById('status').style.color = '#ffcc00'; }
            else if (progress < 0.95) { document.getElementById('status').textContent = '⚠⚠ CRITICAL — near midnight ⚠⚠'; document.getElementById('status').style.color = '#ff6600'; }
            else { document.getElementById('status').textContent = '☢ SECONDS TO MIDNIGHT ☢'; document.getElementById('status').style.color = '#ff3300'; }

            document.title = `${Math.floor(diff/(7*86400000))}w ${Math.floor((diff%(7*86400000))/86400000)}d — Arval Doomsday Clock`;
        }

        function rotateQuote() {
            const el = document.getElementById('doomQuote');
            el.style.opacity = '0';
            setTimeout(() => {
                el.textContent = doomQuotes[quoteIndex];
                el.style.opacity = '1';
                quoteIndex = (quoteIndex + 1) % doomQuotes.length;
            }, 500);
        }

        function createParticle() {
            if (Math.random() > 0.4) return;
            const el = document.createElement('div');
            el.className = 'particle-green';
            el.style.left = Math.random()*100+'vw';
            el.style.top = '-5px';
            const sz = 1+Math.random()*2; el.style.width=sz+'px'; el.style.height=sz+'px';
            document.body.appendChild(el);
            const dur = 4000+Math.random()*4000;
            el.animate([{top:'-5px',opacity:0.2},{top:'105vh',opacity:0}],{duration:dur,easing:'linear'});
            setTimeout(()=>el.remove(),dur);
        }

        setupClock();
        setupWeeks();
        updateCountdown();
        rotateQuote();
        setInterval(updateCountdown, 1000);
        setInterval(createParticle, 250);
        setInterval(rotateQuote, 10000);
    </script>
</body>
</html>
